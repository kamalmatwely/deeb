html,body{

}

  box-shadow:0 0 0 3px rgba(56,189,248,.18)

  height:8px

  background:#1e293b;
  border-radius:99px

  display:inline-block

  border:1px solid var(--line);
  border-radius:18px
}

.hover-row:hover{
  background:rgba(56,189,248,.06)
}

.tab-btn{
  transition:.18s
}

.tab-btn.active{
  background:linear-gradient(90deg,rgba(56,189,248,.22),rgba(250,204,21,.12));
  border-color:rgba(56,189,248,.55)!important;
  color:white
}

.chip{
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 12px;
  font-size:12px;
  background:#0a1126;
  color:#cbd5e1
}

.chip.active{
  background:var(--blue);
  color:#020617;
  border-color:var(--blue);
  font-weight:800
}

.switch{
  width:44px;
  height:24px;
  border-radius:99px;
  background:#334155;
  position:relative;
  flex:none;
  border:none;
  padding:0
}

.switch::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#94a3b8;
  transition:.2s
}

.switch.on{
  background:#16a34a
}

.switch.on::after{
  left:23px;
  background:white
}

.bar{
  transition:height .5s
}

@keyframes pulseDot{
  0%,100%{
    opacity:1
  }

  50%{
    opacity:.25
  }
}

.live-dot{
  animation:pulseDot 1.2s infinite
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(8px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.toast{
  animation:toastIn .25s ease

@keyframes fadeUp{
  from{

    transform:translateY(8px)

  to{

    transform:translateY(0)

}

.fade-up{
